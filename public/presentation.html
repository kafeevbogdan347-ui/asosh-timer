<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Презентация АСОШ №2 — Умный Дневник</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    body {
      background: #090d16;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .brand {
      font-weight: 900;
      font-size: 18px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.2);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.4);
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }
    .slide-card {
      width: 100%;
      max-width: 900px;
      min-height: 480px;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.95));
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
    .slide-tag {
      color: #38bdf8;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 34px;
      font-weight: 900;
      line-height: 1.2;
      color: #ffffff;
      margin-bottom: 16px;
    }
    p.lead {
      font-size: 18px;
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .features-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 16px 0;
    }
    .feature-item {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .feature-icon {
      font-size: 24px;
      line-height: 1;
    }
    .feature-title {
      font-weight: 800;
      font-size: 15px;
      color: #f8fafc;
      margin-bottom: 4px;
    }
    .feature-desc {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.4;
    }
    .speaker-note {
      margin-top: 20px;
      padding: 12px 16px;
      background: rgba(56, 189, 248, 0.1);
      border-left: 4px solid #38bdf8;
      border-radius: 8px;
      font-size: 13px;
      color: #bae6fd;
      line-height: 1.4;
    }
    footer {
      padding: 16px 32px;
      background: rgba(15, 23, 42, 0.9);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn {
      padding: 10px 20px;
      border-radius: 12px;
      border: none;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-prev {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }
    .btn-prev:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .btn-next {
      background: #38bdf8;
      color: #090d16;
    }
    .btn-next:hover {
      background: #7dd3fc;
      transform: translateY(-1px);
    }
    .progress-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .dots {
      display: flex;
      gap: 6px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: all 0.2s;
    }
    .dot.active {
      width: 28px;
      background: #38bdf8;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>🏫</span> МБОУ «АСОШ №2»
      <span class="badge">Презентация для школы</span>
    </div>
    <div style="font-size: 13px; color: #94a3b8;">
      Используйте стрелки ⬅️ / ➡️ на клавиатуре для переключения
    </div>
  </header>

  <main>
    <div class="slide-card" id="slideCard">
      <!-- Динамический контент слайда -->
    </div>
  </main>

  <footer>
    <button class="btn btn-prev" onclick="prevSlide()">← Назад</button>
    <div class="progress-container">
      <div class="dots" id="dotsContainer"></div>
      <span style="font-size: 13px; color: #94a3b8; font-weight: 700;" id="slideCounter">1 / 6</span>
    </div>
    <button class="btn btn-next" onclick="nextSlide()">Вперёд →</button>
  </footer>

  <script>
    const slides = [
      {
        tag: "Слайд 1 • Введение",
        title: "АСОШ №2 — Умный Школьный Дневник",
        lead: "Карманный помощник для учеников, родителей и учителей Аргаяшской школы №2 на 2026 учебный год.",
        grid: [
          { icon: "⚡", title: "100% Бесплатно", desc: "Без рекламы, подписок и закрытых функций." },
          { icon: "📅", title: "Все классы (5–11)", desc: "Полное официальное расписание всех параллелей." },
          { icon: "❄️", title: "Погода в Аргаяше", desc: "Авторасчёт отмены уроков из-за морозов (актировок)." },
          { icon: "📱", title: "Работает везде", desc: "На телефонах Android, iPhone и компьютерах без скачивания." }
        ],
        note: "🎙️ Речь спикера: «Привет всем! Представляем вам удобный цифровой помощник для нашей школы, где собрано всё необходимое для учебы в один клик!»"
      },
      {
        tag: "Слайд 2 • Проблема",
        title: "С чем сталкивается каждый ученик?",
        lead: "Каждый день мы тратим время на поиск базовой информации и решение бытовых учебных вопросов:",
        grid: [
          { icon: "❓", title: "Потерянное расписание", desc: "Бесконечные вопросы в чатах: «Какой урок следующий?», «Какой кабинет?»" },
          { icon: "🎒", title: "Тяжелый рюкзак", desc: "Носим лишние учебники или, наоборот, забываем нужную тетрадь/форму." },
          { icon: "❄️", title: "Непонятные актировки", desc: "Утром в мороз никто не уверен, учится ли класс." },
          { icon: "⏰", title: "Время звонков", desc: "Неизвестно, сколько минут осталось до конца урока или перемены." }
        ],
        note: "🎙️ Речь спикера: «Мы все знаем эти проблемы: постоянные вопросы в чатах, забытые дома тетради и утренние споры в морозы. Наш дневник решает это сразу!»"
      },
      {
        tag: "Слайд 3 • Решение",
        title: "Единая платформа для АСОШ №2",
        lead: "Все инструменты, необходимые школьнику на каждый день, в одном простом интерфейсе:",
        grid: [
          { icon: "📅", title: "Уроки «Сегодня» и «Завтра»", desc: "Мгновенный просмотр сетки занятий с номерами кабинетов." },
          { icon: "🎒", title: "Умный сбор рюкзака", desc: "Автоматический чек-лист учебников и тетрадей по расписанию." },
          { icon: "🔔", title: "Таймер звонков и смен", desc: "Точный отсчет времени для 1 и 2 смен и сокращенных уроков." },
          { icon: "🎯", title: "Калькулятор среднего балла", desc: "Подсказывает, сколько пятерок нужно получить до отличника." }
        ],
        note: "🎙️ Речь спикера: «Приложение сразу готово к работе: выбираешь свой класс — и видишь расписание на сегодня, таймер звонков и список учебников.»"
      },
      {
        tag: "Слайд 4 • Фирменные функции",
        title: "Специально для села Аргаяш",
        lead: "Функции, разработанные с учетом климата и распорядка нашей школы:",
        grid: [
          { icon: "🌐", title: "Погода & Актировки Live", desc: "Точный мониторинг погоды в Аргаяше и расчет отмены уроков для 1–4, 5–9 и 10–11 классов." },
          { icon: "🔔", title: "Пульт звонков школы", desc: "5 реалистичных звуков: советский звонок, гонг, куранты, свисток физрука." },
          { icon: "🎮", title: "8 мини-игр на переменах", desc: "Змейка, Флаппи, 2048, Сапер, Пакман и др. — работают без интернета!" },
          { icon: "🔒", title: "100% Конфиденциальность", desc: "Никаких паролей и регистраций, данные сохраняются только на телефоне." }
        ],
        note: "🎙️ Речь спикера: «Детектор актировок каждое утро подскажет, есть ли занятия в Аргаяше, а на переменах можно поиграть в мини-игры даже без сети.»"
      },
      {
        tag: "Слайд 5 • Польза",
        title: "Польза для всей школы",
        lead: "Удобно и ученикам, и родителям, и учителям:",
        grid: [
          { icon: "🎓", title: "Ученикам", desc: "Всегда вовремя на уроках, собраны нужные тетради, контроль своих оценок." },
          { icon: "👨‍👩‍👧", title: "Родителям", desc: "Знают точное время смены, статус актировок утром и помогают со сборами." },
          { icon: "👩‍🏫", title: "Учителям", desc: "Меньше опозданий и забытых принадлежностей в классе." },
          { icon: "🏫", title: "Школе", desc: "Современный статус и цифровое развитие АСОШ №2." }
        ],
        note: "🎙️ Речь спикера: «Это делает школьную жизнь проще и организованнее для всех участников учебного процесса.»"
      },
      {
        tag: "Слайд 6 • Старт",
        title: "Как начать пользоваться прямо сейчас?",
        lead: "Всего 3 простых шага без регистрации и скачивания тяжелых файлов:",
        grid: [
          { icon: "1️⃣", title: "Открой ссылку", desc: "Перейди по ссылке в браузере телефона или компьютера." },
          { icon: "2️⃣", title: "Добавь на экран", desc: "Нажми «Добавить на главный экран» для быстрого запуска." },
          { icon: "3️⃣", title: "Выбери свой класс", desc: "Выбери параллель от 5А до 11Б — и всё работает!" },
          { icon: "📢", title: "Поделись с классом", desc: "Отправь ссылку друзьям и в беседу своего класса!" }
        ],
        note: "🎙️ Речь спикера: «Спасибо за внимание! Переходите по ссылке, пользуйтесь и делитесь с одноклассниками!»"
      }
    ];

    let current = 0;

    function render() {
      const s = slides[current];
      const card = document.getElementById('slideCard');
      
      let gridHtml = '';
      if (s.grid) {
        gridHtml = `<div class="features-grid">` + s.grid.map(g => `
          <div class="feature-item">
            <div class="feature-icon">${g.icon}</div>
            <div>
              <div class="feature-title">${g.title}</div>
              <div class="feature-desc">${g.desc}</div>
            </div>
          </div>
        `).join('') + `</div>`;
      }

      card.innerHTML = `
        <div>
          <div class="slide-tag">${s.tag}</div>
          <h1>${s.title}</h1>
          <p class="lead">${s.lead}</p>
          ${gridHtml}
        </div>
        <div class="speaker-note">${s.note}</div>
      `;

      // Counter
      document.getElementById('slideCounter').innerText = `${current + 1} / ${slides.length}`;

      // Dots
      const dotsContainer = document.getElementById('dotsContainer');
      dotsContainer.innerHTML = slides.map((_, i) => `
        <div class="dot ${i === current ? 'active' : ''}" onclick="goToSlide(${i})"></div>
      `).join('');
    }

    function nextSlide() {
      if (current < slides.length - 1) {
        current++;
        render();
      }
    }

    function prevSlide() {
      if (current > 0) {
        current--;
        render();
      }
    }

    function goToSlide(i) {
      current = i;
      render();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'Space') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
    });

    render();
  </script>
</body>
</html>
