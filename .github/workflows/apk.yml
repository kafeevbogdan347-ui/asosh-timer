name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  apk:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Секрет APP_ENV — содержимое .env: CLASS_CODES, DEV_PASSWORD, VITE_FIREBASE_*
      - name: Write .env from secret
        run: |
          printf '%s\n' "$APP_ENV" > .env
          # Ключ Асошика — отдельным секретом, чтобы не трогать APP_ENV
          if [ -n "$GEMINI_API_KEY" ]; then printf 'VITE_GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> .env; fi
          # Коды классов отдельным секретом: строка ниже важнее CLASS_CODES из APP_ENV
          if [ -n "$CLASS_CODES" ]; then printf 'CLASS_CODES="%s"\n' "$CLASS_CODES" >> .env; fi
          # Настройки Firebase отдельным секретом: строки ниже важнее VITE_FIREBASE_* из APP_ENV
          if [ -n "$FIREBASE_ENV" ]; then printf '%s\n' "$FIREBASE_ENV" >> .env; fi
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLASS_CODES: ${{ secrets.CLASS_CODES }}
          FIREBASE_ENV: ${{ secrets.FIREBASE_ENV }}
      # В APK приложение открывается с корня, поэтому BASE_PATH не задаём
      - run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npx cap add android
      - run: npx cap sync android
      # Виджет на рабочий стол и плагин для него (native/android)
      - run: bash native/android/install.sh
      # Микрофон для голосовых вопросов и камера для фото задания Асошику
      - name: Microphone and camera permissions
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -c RECORD_AUDIO android/app/src/main/AndroidManifest.xml
      # Номер версии растёт с каждой сборкой, чтобы новый APK ставился поверх старого
      - name: Set version
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      # Подписываем постоянным ключом из секретов: тогда обновления встают поверх и данные сохраняются.
      # Без секретов — запасной вариант с отладочной подписью
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Пробелы и переносы строк могли попасть в секрет при вставке — убираем их
            CLEAN=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')
            echo "Длина ключа в секрете: ${#CLEAN} символов (должно быть 3552)"
            if ! printf '%s' "$CLEAN" | base64 -d > release.p12 2>/dev/null; then
              echo "::error::Секрет ANDROID_KEYSTORE_BASE64 испорчен — вставь заново содержимое keystore-base64.txt"
              exit 1
            fi
            "$BT/apksigner" sign --ks release.p12 --ks-type PKCS12 --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias asosh --out asosh-timer.apk aligned.apk
            rm release.p12
          else
            echo "::warning::Нет секрета ANDROID_KEYSTORE_BASE64 — APK подписан отладочным ключом"
            mkdir -p ~/.android
            [ -f ~/.android/debug.keystore ] || keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            "$BT/apksigner" sign --ks ~/.android/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --out asosh-timer.apk aligned.apk
          fi
          "$BT/apksigner" verify --print-certs asosh-timer.apk | head -3
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: АСОШ Таймер для Android
          body: |
            Последняя сборка приложения для Android. Обновляется автоматически при каждом изменении.
            Скачай asosh-timer.apk и открой его на телефоне. Android попросит разрешить установку из этого источника.
          files: asosh-timer.apk
          make_latest: true
